server:
  port: 8082
spring:
  application:
    name: ms-competencia
  datasource:
    url: jdbc:postgresql://localhost:5432/linketinder_competencia_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true